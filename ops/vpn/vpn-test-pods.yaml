# Disposable test pods for validating VPN-egress node routing
# (profile::platform::baseline::debian::virtual::k3s::vpn_egress_routing)
#
# vpn-test:     attached to the vpn-gateway NAD on 10.58.0.59 (top of the
#               range, permanently unused by real workloads). Used to
#               confirm traffic bound to that IP routes via zulu.
# non-vpn-test: no vpn-gateway attachment at all. Used to confirm normal
#               pods on the same node are unaffected by the mangle rule.
#
# NODE_NAME_PLACEHOLDER is substituted by test-vpn-egress.sh before apply.
#
apiVersion: v1
kind: Pod
metadata:
  name: vpn-test
  namespace: vpn
  annotations:
    setGateway: "false"
    k8s.v1.cni.cncf.io/networks: |
      [{
        "name": "vpn-gateway",
        "namespace": "network",
        "ips": ["10.58.0.59"]
      }]
spec:
  nodeName: NODE_NAME_PLACEHOLDER
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  initContainers:
    - name: vpn-routing
      image: nicolaka/netshoot
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
      command:
        - sh
        - -c
        - |
          set -e
          GW=$(ip route show default | awk '{print $3; exit}')
          echo "Captured CNI gateway: ${GW}"
          # Pod CIDR route is already added automatically by the CNI - no need to add it again.
          # Service CIDR needs an explicit route via the same gateway (NOT on-link/no-via,
          # since service IPs are virtual and not real L2 neighbours).
          ip route add 10.43.0.0/16 via "${GW}" dev eth0
          ip route del default
          ip route add default via 10.58.0.24 dev net1
          ip route show
  containers:
    - name: vpn-test
      image: curlimages/curl
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: non-vpn-test
  namespace: vpn
  annotations:
    setGateway: "false"
spec:
  nodeName: NODE_NAME_PLACEHOLDER
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: non-vpn-test
      image: curlimages/curl
      command: ["sleep", "3600"]
