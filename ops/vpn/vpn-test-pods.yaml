# Disposable test pods for validating VPN-egress node routing
# (profile::platform::baseline::debian::virtual::k3s::vpn_egress_routing)
#
# vpn-test:     attached to the vpn-gateway NAD on 10.58.0.59 (top of the
#               range, permanently unused by real workloads). Used to
#               confirm traffic bound to that IP routes via zulu.
# non-vpn-test: no vpn-gateway attachment at all. Used to confirm normal
#               pods on the same node are unaffected by the mangle rule.
#
# NODE_NAME_PLACEHOLDER is substituted by test-vpn-egress.sh before apply.
#
apiVersion: v1
kind: Pod
metadata:
  name: vpn-test
  namespace: network
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [{
        "name": "vpn-gateway",
        "namespace": "network",
        "ips": ["10.58.0.59"]
      }]
spec:
  nodeName: NODE_NAME_PLACEHOLDER
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: vpn-test
      image: curlimages/curl
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: non-vpn-test
  namespace: network
spec:
  nodeName: NODE_NAME_PLACEHOLDER
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: non-vpn-test
      image: curlimages/curl
      command: ["sleep", "3600"]
