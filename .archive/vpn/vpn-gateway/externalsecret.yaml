---
resources:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: &creds privatevpn-ovn
      labels:
        app.kubernetes.io/name: pod-gateway
        app.kubernetes.io/instance: vpn-gateway
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden
      target:
        name: *creds
        creationPolicy: Owner
      dataFrom:
        - extract:
            key: privatevpn_ovn

  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: &auth gluetun-auth
      labels:
        app.kubernetes.io/name: pod-gateway
        app.kubernetes.io/instance: vpn-gateway
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden
      target:
        name: *auth
        creationPolicy: Owner
        template:
          data:
            config.toml: |
              [[roles]]
              name = "exporter"
              auth = "apikey"
              apikey = "{{ .apikey }}"
      dataFrom:
        - extract:
            key: gluetun_auth

  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: &vpnconfig privatevpn-ovn-conf
      labels:
        app.kubernetes.io/name: pod-gateway
        app.kubernetes.io/instance: vpn-gateway
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden
      target:
        name: *vpnconfig
        creationPolicy: Owner
        template:
          engineVersion: v2
          data:
            # Key name matched by the init container in values.yaml
            base-custom.conf: "{{ .ovn_raw }}\n"
      data:
        - secretKey: ovn_raw
          remoteRef:
            key: privatevpn_ovn_conf
