---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml


repositories:
  - name: strrl.dev
    url: https://helm.strrl.dev


releases:
  - name: cloudflare-tunnel-ingress-controller
    chart: strrl.dev/cloudflare-tunnel-ingress-controller
    version: 0.1.0
    inherit:
      - template: namespace
    values:
      - values.yaml

  - name: cloudflare-tunnel-ingress-controller-external-secret
    inherit:
      - template: namespace
      - template: raw
