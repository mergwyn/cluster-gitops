---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
bases:
  - ../../../common/base.yaml

apiVersions:
  - monitoring.coreos.com/v1

repositories:
  - name: traefik
    url: https://traefik.github.io/charts

releases:
  - name: traefik
    chart: traefik/traefik
    version: 41.7.1
    inherit:
      - template: namespace
    values:
      - service.yaml.gotmpl
      - values.yaml
