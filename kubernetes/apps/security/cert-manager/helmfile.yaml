---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

repositories:
  - name: jetstack
    url: https://charts.jetstack.io/

releases:
  - name: cert-manager
    chart: jetstack/cert-manager
    version: v1.21.2
    inherit:
      - template: namespace
    secrets:
      - cloudflare-cert-manager-token-sops.yaml
    values:
      - values.yaml

  - name: cert-manager-resources
    inherit:
      - template: namespace
      - template: raw
      - template: cluster-scoped
