---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

apiVersions:
  - "monitoring.coreos.com/v1/ServiceMonitor"

repositories:
  - name: external-secrets
    url: https://charts.external-secrets.io/

releases:
  # Main External Secrets Chart
  - name: external-secrets
    chart: external-secrets/external-secrets
    version: 2.13.0
    inherit:
    - template: namespace
    secrets:
      - bitwarden-tokens-sops.yaml
    values:
      - values.yaml

  # Additional raw manifests
  - name: external-secrets-resources
    inherit:
    - template: namespace
    - template: raw
    - template: cluster-scoped
