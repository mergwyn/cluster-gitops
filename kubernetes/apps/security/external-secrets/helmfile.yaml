---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

apiVersions:
  - "monitoring.coreos.com/v1/ServiceMonitor"

repositories:
  - name: external-secrets
    url: https://charts.external-secrets.io/

releases:
  # SOPS secrets required to bootstrap everything
  - name: sops-secrets
    chart: bedag/raw
    version: 2.0.2
    inherit:
    - template: namespace
    secrets:
      - bitwarden-access-token-sops.yaml
    transformers:
      - ../../../common/transformers/common-annotations.yaml.gotmpl
      - ../../../common/transformers/common-labels.yaml.gotmpl

  # TODO do certs need to be separtared from resources?
  - name: external-secrets-resources
    inherit:
    - template: namespace
    - template: raw
    - template: cluster-scoped

  # Main External Secrets Chart
  - name: external-secrets
    chart: external-secrets/external-secrets
    version: 2.12.0
    inherit:
    - template: namespace
    values:
      - values.yaml


