---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
bases:
  - ../../../common/base.yaml

repositories:
  - name: openebs
    url: https://openebs.github.io/openebs

releases:
  - name: openebs
    chart: openebs/openebs
    version: 4.6.2
    inherit:
      - template: namespace
    values:
      - values.yaml

  - name: openebs-extra
    inherit:
      - template: namespace
      - template: raw
