---
updatePolicy:
  updateMode: "Off"

recommender:
  # enabled: false
  extraArgs:
    storage: prometheus
    # yamllint disable-line rule:line-length
    prometheus-address: "http://kube-prometheus-stack-prometheus:9090/"
  resources:
    requests:
      cpu: 15m
      memory: 105M
    limits:
      # cpu:
      memory: 124M

updater:
  extraArgs:
    in-place-skip-disruption-budget: true
  resources:
    requests:
      cpu: 15m
      memory: 105M
    limits:
      # cpu:
      memory: 105M

admissionController:
  resources:
    requests:
      cpu: 15m
      memory: 105M
    limits:
      # cpu:
      memory: 124M
