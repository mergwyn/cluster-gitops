---
# yamllint disable rule:line-length
additionalPrometheusRulesMap:
  additional-rules:
    groups:
      - name: node_alerts
        rules:
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} is down"
              description: "Prometheus cannot scrape the node-exporter on {{ $labels.instance }}."

      - name: oomkills
        rules:
          - alert: HostOomKillDetected
            expr: (increase(node_vmstat_oom_kill[1m]) > 0)
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: Host OOM kill detected (instance {{ $labels.instance }})
              description: |-
                "OOM kill detected\n VALUE = {{ $value }}\n LABELS = {{ $labels }}"
          - alert: KubernetesContainerOomKiller
            expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: Kubernetes Container oom killer (instance {{ $labels.instance }})
              description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - name: openvox
        rules:
          - alert: OpenVoxAgentNotRunning
            expr: |
              (
                time() - openvox_last_run_timestamp_seconds{job="node-exporter",instance="xray"} > 3600
              )
              and
              (up{job="node-exporter",instance="xray"} == 1)
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "OpenVox agent has not run on {{ $labels.instance }}"
              description: "OpenVox has not completed a run on {{ $labels.instance }} for more than 1 hour."

          - alert: OpenVoxAgentRunFailed
            expr: openvox_last_run_failed_resources{job="node-exporter",instance="xray"} > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "OpenVox agent run failed on {{ $labels.instance }}"
              description: "The most recent OpenVox run on {{ $labels.instance }} reported {{ $value }} failed resources."
