---
# yamllint disable rule:line-length
additionalPrometheusRulesMap:
  additional-rules:
    groups:
      - name: oomkills
        rules:
          - alert: HostOomKillDetected
            expr: (increase(node_vmstat_oom_kill[1m]) > 0)
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: Host OOM kill detected (instance {{ $labels.instance }})
              description: |-
                "OOM kill detected\n VALUE = {{ $value }}\n LABELS = {{ $labels }}"
          - alert: KubernetesContainerOomKiller
            expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: Kubernetes Container oom killer (instance {{ $labels.instance }})
              description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - name: openvox
        rules:
          - alert: OpenVoxAgentNotRunning
            expr:  time() - openvox_last_run_timestamp_seconds{job="node-exporter"} > 3600
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "OpenVox agent has not run on {{ $labels.instance }}"
              description: "OpenVox has not completed a run on {{ $labels.instance }} for more than 1 hour."

          - alert: OpenVoxAgentRunFailed
            expr: openvox_last_run_failed_resources{job="node-exporter"} > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "OpenVox agent run failed on {{ $labels.instance }}"
              description: "The most recent OpenVox run on {{ $labels.instance }} reported {{ $value }} failed resources."

  vpa-rules:
    groups:
      - name: vpa-sizing.symptoms
        rules:
          - alert: ContainerMemoryNearLimit
            expr: |
              max_over_time(container_memory_working_set_bytes{container!=""}[5m])
                / on(namespace, pod, container)
                  kube_pod_container_resource_limits{resource="memory", unit="byte"}
              > 0.9
            for: 15m
            labels:
              severity: warning
              category: resources
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) using >90% of its memory limit"
              description: "Working set within 10% of the limit for 15m. OOMKill risk — compare against the VPA upper bound and raise the limit."
              value: "{{ $value | humanizePercentage }}"

          - alert: ContainerCPUThrottled
            expr: |
              rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m])
                / rate(container_cpu_cfs_periods_total{container!=""}[5m])
              > 0.25
            for: 30m
            labels:
              severity: warning
              category: resources
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) CPU throttled"
              description: "More than 25% of CFS periods throttled for 30m. CPU limit is too low."
              value: "{{ $value | humanizePercentage }}"

          - alert: ContainerOOMKilledRestarting
            expr: |
              increase(kube_pod_container_status_restarts_total[15m]) > 0
                and on(namespace, pod, container)
                  kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 5m
            labels:
              severity: warning
              category: resources
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted, last termination OOMKilled"
              description: "Restart churn on a container last terminated for OOMKilled. Raise memory limit/request."

      - name: vpa-sizing.hygiene
        rules:
          - record: workload_container_memory_limit_bytes
            expr: |
              max by (namespace, target_name, container) (
                kube_pod_container_resource_limits{resource="memory", unit="byte"}
                  * on(namespace, pod) group_left(target_name)
                    (
                      label_replace(
                        kube_pod_owner{owner_kind=~"StatefulSet|DaemonSet"},
                        "target_name", "$1", "owner_name", "(.*)"
                      )
                      or
                      (
                        label_replace(
                          kube_pod_owner{owner_kind="ReplicaSet"},
                          "rsname", "$1", "owner_name", "(.*)"
                        )
                        * on(namespace, rsname) group_left(target_name)
                          label_replace(
                            label_replace(
                              kube_replicaset_owner{owner_kind="Deployment"},
                              "rsname", "$1", "replicaset", "(.*)"
                            ),
                            "target_name", "$1", "owner_name", "(.*)"
                          )
                      )
                    )
              )

          - alert: WorkloadLimitBelowVPAUpperBound
            expr: |
              workload_container_memory_limit_bytes
                < on(namespace, target_name, container) group_left()
                  kube_customresource_vpa_containerrecommendations_upperbound{resource="memory"}
            for: 24h
            labels:
              severity: info
              category: sizing
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.target_name }} ({{ $labels.container }}) memory limit below VPA upper bound"
              description: "Limit is under the VPA peak estimate. VPA is Off, so this is a manual tuning prompt — Goldilocks Burstable recipe: requests=lowerBound, limits=upperBound."
              limit: "{{ $value | humanize1024 }}B"

  custom-target-down:
    groups:
      - name: node_alerts
        rules:
          - alert: NodeDown
            expr: up{job="host-node-exporter",monitoring!="intermittent"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} is down"
              description: "Prometheus cannot scrape the node-exporter on {{ $labels.instance }}."

          - alert: NodeExpectedOffline
            expr: up{job="node-exporter", monitoring="intermittent"} == 0
            for: 5m
            labels:
              severity: none
            annotations:
              summary: "Intermittent node offline (expected)"

      - name: custom.rules
        rules:
          - alert: TargetDown
            expr: |
              100 * (
                count by (job, namespace, service) (up{monitoring!="intermittent"} == 0)
                /
                count by (job, namespace, service) (up{monitoring!="intermittent"})
              ) > 10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "One or more targets are unreachable."
              description: "{{ $value | humanizePercentage }} of targets in {{ $labels.job }}/{{ $labels.namespace }} are down."
