---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

repositories:
  - name: open-webui
    url: https://helm.openwebui.com

releases:
  - name: open-webui
    chart: open-webui/open-webui
    version: "16.6.0"
    inherit:
      - template: namespace
    values:
      - values.yaml.gotmpl

  - name: openwebui-external-secret
    inherit:
      - template: namespace
      - template: raw
