---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

repositories:
  - name: bjw-s-labs
    url: ghcr.io/bjw-s-labs/helm
    oci: true

releases:
  - name: multus
    chart: bjw-s-labs/multus
    version: 1.3.6
    inherit:
      - template: namespace
    values:
      - values.yaml

  - name: multus-resources
    inherit:
      - template: namespace
      - template: raw
