---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret helmfile-doctor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HELMFILE_LLM_API_KEY: '{{ (.openrouter | fromYaml).doctor_private }}'
  data:
    - secretKey: openrouter
      remoteRef:
        key: openrouter_api_key
