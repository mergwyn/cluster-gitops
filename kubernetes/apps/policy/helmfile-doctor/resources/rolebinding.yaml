---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helmfile-doctor-reader
  namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: helmfile-doctor-reader
subjects:
  - kind: ServiceAccount
    name: helmfile-doctor
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helmfile-doctor-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helmfile-doctor-argocd
subjects:
  - kind: ServiceAccount
    name: helmfile-doctor
    namespace: kube-system
