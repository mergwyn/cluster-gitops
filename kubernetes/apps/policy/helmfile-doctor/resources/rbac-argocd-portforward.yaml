---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helmfile-doctor-argocd
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helmfile-doctor-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helmfile-doctor-argocd
subjects:
  - kind: ServiceAccount
    name: helmfile-doctor
    namespace: kube-system
