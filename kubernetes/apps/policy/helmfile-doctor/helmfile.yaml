---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../clusters/environments.yaml

repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts

releases:
  - name: helmfile-doctor
    namespace: '{{ env "HELMFILE_NAMESPACE" }}'
    chart: bedag/raw
    version: 2.0.2
    values:
      - values.yaml

  - name: hemfile-doctor-external-secret
    chart: bedag/raw
    version: 2.0.2
    namespace: '{{ env "HELMFILE_NAMESPACE" }}'
    values:
      - externalsecret.yaml
