---
# CEL-based variant of set-pv-to-retain-on-keep
# Migration: Changed kind from ClusterPolicy to MutatingPolicy
# Original used mutate.targets with preconditions for cross-resource mutation.
# In CEL, this maps to targetMatchConstraints + matchConditions.
#
# BEHAVIORAL CHANGE: Original precondition matched target.metadata.name == request.object.spec.volumeName.
# In CEL, we use targetMatchConstraints with a CEL expression to filter targets.
# The match rule triggers on PVC CREATE/UPDATE with the specific annotation,
# and the mutation applies to PersistentVolumes filtered by the volumeName reference.
# TODO(migration): Verify that the volumeName matching behavior is equivalent.
#
# Original had mutateExistingOnPolicyUpdate: true; mapped to evaluation.mutateExisting.enabled: true
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kyverno.io/mutatingpolicy_v1.json

apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-pv-to-retain-on-keep
  annotations:
    policies.kyverno.io/title: Set PV to Retain if helm keep
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    kyverno.io/kyverno-version: 1.7.0
    policies.kyverno.io/minversion: 1.7.0
    kyverno.io/kubernetes-version: "1.23"
    policies.kyverno.io/description: >-
      Add label to PV if PVC is set to keep by helm
spec:
  evaluation:
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - persistentvolumeclaims
  matchConditions:
    - name: match-helm-keep-annotation
      expression: "object.metadata.?annotations.?['helm.sh/resource-policy'] == 'keep'"
  mutations:
    - name: add-retain-to-pv
      targets:
        - name: mutate-pv
          apiGroups:
            - ''
          kinds:
            - PersistentVolume
      patchType: ApplyConfiguration
      patch:
        spec:
          persistentVolumeReclaimPolicy: "Retain"
      targetMatchConditions:
        - name: match-pvc-volume
          expression: "target.metadata.name == object.spec.volumeName"
