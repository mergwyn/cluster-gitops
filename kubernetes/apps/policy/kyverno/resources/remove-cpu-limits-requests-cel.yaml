---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: remove-cpu-limits
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(object.spec.containers))
            .filter(i,
              has(object.spec.containers[i].resources) &&
              has(object.spec.containers[i].resources.limits) &&
              'cpu' in object.spec.containers[i].resources.limits)
            .map(i, JSONPatch{
              op: "remove",
              path: "/spec/containers/" + string(i) + "/resources/limits/cpu"
            })