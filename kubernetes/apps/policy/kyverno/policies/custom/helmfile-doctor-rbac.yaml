---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-helmfile-doctor-binding
spec:
  generateExisting: true
  rules:
    - name: helmfile-doctor-rolebinding
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
      generate:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: helmfile-doctor-reader
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: helmfile-doctor-reader
          subjects:
            - kind: ServiceAccount
              name: helmfile-doctor
              namespace: kube-system
