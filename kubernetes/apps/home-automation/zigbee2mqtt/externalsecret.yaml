---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.3.0/charts/library/common/values.schema.json
rawResources:
  mqtt-credentials:
    enabled: true
    manifest:
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: bitwarden-secrets
        target:
          name: "{{.Release.Name}}-mqtt-credentials"
          creationPolicy: Owner
        dataFrom:
          - extract:
              key: mqtt_credentials

  zigbee2mqtt-secret:
    enabled: true
    manifest:
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      spec:
        target:
          name: zigbee2mqtt-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              zigbee_network_key: "{{`{{ (.zigbee_network | fromJson).network_key | toJson }}`}}"
              zigbee_ext_pan_id: "{{`{{ (.zigbee_network | fromJson).ext_pan_id | toJson }}`}}"
              zigbee_pan_id: "{{`{{ (.zigbee_network | fromJson).pan_id | toJson }}`}}"
              mqtt_user: "{{`{{ .mqtt_user }}`}}"
              mqtt_password: "{{`{{ .mqtt_password }}`}}"
        data:
          # Secrets Manager: Zigbee network keys
          - secretKey: zigbee_network
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-secrets
            remoteRef:
              key: zigbee_network

          # Password Manager vault: MQTT credentials
          - secretKey: mqtt_user
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: &mqtt ce16fbf3-c915-4a43-bde7-b4f00126a169
              property: username
          - secretKey: mqtt_password
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: *mqtt
              property: password
