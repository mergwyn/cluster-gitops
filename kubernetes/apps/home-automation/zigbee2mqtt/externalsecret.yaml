---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.2.1/charts/library/common/values.schema.json
rawResources:
  mqtt-credentials:
    enabled: true
    manifest:
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: bitwarden-secrets
        target:
          name: "{{.Release.Name}}-mqtt-credentials"
          creationPolicy: Owner
        dataFrom:
          - extract:
              key: mqtt_credentials

  zigbee2mqtt-secret:
    enabled: true
    manifest:
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      spec:
        target:
          name: zigbee2mqtt-secret
          creationPolicy: Owner
        data:
          # Secrets Manager: Zigbee network keys
          - secretKey: zigbee_pan_id
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-secrets
            remoteRef:
              key: zigbee_network
              property: pan_id
          - secretKey: zigbee_ext_pan
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-secrets
            remoteRef:
              key: zigbee_network
              property: ext_pan_id
          - secretKey: zigbee_network_key
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-secrets
            remoteRef:
              key: zigbee_network
              property: network_key

          # Password Manager vault: MQTT credentials
          - secretKey: mqtt_user
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: &mqtt ce16fbf3-c915-4a43-bde7-b4f00126a169
              property: username
          - secretKey: mqtt_password
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: *mqtt
              property: password
