---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.2.1/charts/library/common/values.schema.json
rawResources:
  secret:
    enabled: true
    manifest:
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      spec:
        target:
          name: zigbee2mqtt-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              secrets.yaml: |
                zigbee_network_key: "{{`{{ (.zigbee_network | fromJson).network_key | toJson }}`}}"
                zigbee_ext_pan_id: "{{`{{ (.zigbee_network | fromJson).ext_pan_id | toJson }}`}}"
                mqtt_user: "{{`{{ .mqtt_user }}`}}"
                mqtt_password: "{{`{{ .mqtt_password }}`}}"
        data:
          # Secrets Manager: Zigbee network keys
          - secretKey: zigbee_network
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-secrets
            remoteRef:
              key: zigbee_network

          # Password Manager vault: MQTT credentials
          - secretKey: mqtt_user
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: &mqtt ce16fbf3-c915-4a43-bde7-b4f00126a169
              property: username
          - secretKey: mqtt_password
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: *mqtt
              property: password

  secret-file:
    enabled: true
    manifest:
      kind: ExternalSecret
      apiVersion: external-secrets.io/v1
      spec:
        target:
          name: zigbee2mqtt-secret-file
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              secrets.yaml: |
                network_key: {{`{{ (.zigbee_secret | fromYaml).network_key | toJson }}`}}
                ext_pan_id: {{`{{ (.zigbee_secret | fromYaml).ext_pan_id | toJson }}`}}
                mqtt_user: '{{`{{ .mqtt_user }}`}}'
                mqtt_password: '{{`{{ .mqtt_password }}`}}'
        data:
          # Secrets Manager: Zigbee network keys
          - secretKey: zigbee_secret
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-secrets
            remoteRef:
              key: zigbee_secret

          # Password Manager vault: MQTT credentials
          - secretKey: mqtt_user
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: &mqtt ce16fbf3-c915-4a43-bde7-b4f00126a169
              property: username
          - secretKey: mqtt_password
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: bitwarden-vault-login
            remoteRef:
              key: *mqtt
              property: password
