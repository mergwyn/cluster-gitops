---
bases:
  - ../../../clusters/environments.yaml

repositories:
  - name: bjw-s-labs
    url: https://bjw-s-labs.github.io/helm-charts
releases:
  - name: home-assistant
    chart: bjw-s-labs/app-template
    version: 5.2.1
    namespace: '{{ env "HELMFILE_NAMESPACE" }}'
    values:
      - values.yaml
      - values-init-scripts.yaml.gotmpl
      - values-route.yaml.gotmpl
      - externalsecret.yaml
