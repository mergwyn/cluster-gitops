---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.2.1/charts/library/common/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

controllers:
  home-assistant:
    annotations:
      reloader.stakater.com/auto: "true"
      secret.reloader.stakater.com/reload: "home-assistant-prometheus"

    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      annotations:
    #        pre.hook.backup.velero.io/container: sqlite-tools
    #        pre.hook.backup.velero.io/command: |
    #          /bin/sh -c '
    #          set -e
    #          echo "[velero] pre-backup sqlite WAL checkpoint"
    #          command -v sqlite3 >/dev/null
    #          sqlite3 /config/home-assistant_v2.db "PRAGMA wal_checkpoint(TRUNCATE);"
    #          sync
    #          '
    #        post.hook.restore.velero.io/container: sqlite-tools
    #        post.hook.restore.velero.io/command: |
    #          /bin/sh -c '
    #          set -e
    #          echo "[velero] post-restore sqlite integrity check"
    #          DB=/config/home-assistant_v2.db
    #
    #          if [ ! -f "$DB" ]; then
    #            echo "HA DB missing after restore — refusing to start"
    #            exit 1
    #          fi
    #
    #          if ! sqlite3 "$DB" "PRAGMA integrity_check;" | grep -q "^ok$"; then
    #            echo "HA DB integrity check FAILED — refusing to start"
    #            exit 1
    #          fi
    #
    #          echo "HA DB integrity check OK"
    #          '

    initContainers:
      config-initialisation:
        image:
          repository: docker.io/alpine/git
          tag: 2.54.0@sha256:ac6c828f15d82775d204d3d75112e1d34af8945da80ccf922713c9891ba68e7a
        command: ["/bin/sh", "/scripts/initialise.sh"]

        securityContext:
          runAsUser: 0

    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          # yamllint disable-line rule:line-length
          tag: 2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
        env:
          TZ: Europe/London
          VENV_FOLDER: /venv
        envFrom:
          - secretRef:
              name: "{{.Release.Name}}-github"
        resources:
          requests:
            cpu: 163m
            memory: 1239M
          limits:
            memory: 2G

      sqlite-tools:
        image:
          repository: docker.io/library/alpine
          tag: 3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
        command: ["/bin/sh", "-c"]
        args:
          - apk add --no-cache sqlite && sleep infinity
        securityContext:
          runAsUser: 0

      code-server:
        image:
          repository: ghcr.io/coder/code-server
          # yamllint disable-line rule:line-length
          tag: 4.145.0@sha256:992796b850b8b7ec6f7393b8dd2295840a65cf5071981990ff41ef52dd566c43
        args:
          - --auth=none
          - --disable-telemetry
          - --disable-update-check
          - --user-data-dir=/config/.code-server
          - --extensions-dir=/config/.code-server
          # - --install-extension=trunk.io
          - --port=12322
          - /config
        env:
          TZ: Europe/London
          HASS_SERVER: http://localhost:8123
          # yamllint disable-line rule:line-length
          EXTENSIONS_GALLERY: '{ "serviceUrl": "https://marketplace.visualstudio.com/_apis/public/gallery", "itemUrl": "https://marketplace.visualstudio.com/items" }'
        envFrom:
          - secretRef:
              name: "{{.Release.Name}}-github"
        resources:
          requests:
            cpu: 10m
            memory: 978M
          limits:
            memory: 5G

service:
  app:
    forceRename: "{{.Release.Name}}"
    ports:
      http:
        port: &http-port 8123
  code-server:
    ports:
      http:
        port: &code-server-port 12322

serviceMonitor:
  app:
    enabled: true
    serviceName: "{{.Release.Name}}"
    endpoints:
      - port: http
        scheme: http
        interval: 1m
        scrapeTimeout: 30s
        path: /api/prometheus
        bearerTokenSecret:
          name: home-assistant-prometheus
          key: token

persistence:
  config:
    forceRename: "{{.Release.Name}}-config"
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    retain: true
    size: 10Gi
    globalMounts:
      - path: /config
  backups:
    enabled: true
    existingClaim: home-assistant-backup-nfs-pvc
    globalMounts:
      - path: /config/backups
  secrets:
    type: secret
    name: "{{.Release.Name}}-secret"
    globalMounts:
      - path: /config/secrets.yaml
        subPath: secrets.yaml
        readOnly: true

  init-scripts:
    type: configMap
    identifier: config-initialisation
    defaultMode: 0555
    advancedMounts:
      home-assistant:
        config-initialisation:
          - path: /scripts
            readOnly: true

  tmpfs:
    type: emptyDir
    advancedMounts:
      home-assistant:
        app:
          - path: /tmp
            subPath: hass-tmp
        code-server:
          - path: /tmp
            subPath: code-server-tmp
          - path: /nonexistent
            subPath: nonexistent

rawResources:
  rules:
    enabled: true
    manifest:
      kind: PrometheusRule
      apiVersion: monitoring.coreos.com/v1
      spec:
        groups:
          - name: home-assistant
            rules:
              - alert: HomeAssistantAbsent
                annotations:
                  description: |
                    Home Assistant has disappeared from
                    Prometheus service discovery.
                  summary: Home Assistant is down.
                expr: |
                  absent(up{job=~".*home-assistant.*"} == 1)
                for: 5m
                labels:
                  severity: critical
              - alert: HomeAssistantGuardrailTriggered
                expr: |
                  kube_pod_container_status_waiting_reason{
                    namespace="home-assistant",
                    pod=~"home-assistant-.*",
                    container="app",
                    reason="CrashLoopBackOff"
                  } > 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: Home Assistant refused to start (DB guardrail)
                  description: |
                    Home Assistant is CrashLooping.
                    This usually indicates a failed SQLite integrity check
                    after restore or storage corruption.
