---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.2.1/charts/library/common/values.schema.json

defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

controllers:
  home-assistant:
    annotations:
      secret.reloader.stakater.com/reload: >-
        {{- list
          (printf "%s-secret" .Release.Name)
          (printf "%s-github" .Release.Name)
          (printf "%s-prometheus" .Release.Name)
          | join ","
        -}}

    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      annotations:
    #        pre.hook.backup.velero.io/container: sqlite-tools
    #        pre.hook.backup.velero.io/command: |
    #          /bin/sh -c '
    #          set -e
    #          echo "[velero] pre-backup sqlite WAL checkpoint"
    #          command -v sqlite3 >/dev/null
    #          sqlite3 /config/home-assistant_v2.db "PRAGMA wal_checkpoint(TRUNCATE);"
    #          sync
    #          '
    #        post.hook.restore.velero.io/container: sqlite-tools
    #        post.hook.restore.velero.io/command: |
    #          /bin/sh -c '
    #          set -e
    #          echo "[velero] post-restore sqlite integrity check"
    #          DB=/config/home-assistant_v2.db
    #
    #          if [ ! -f "$DB" ]; then
    #            echo "HA DB missing after restore — refusing to start"
    #            exit 1
    #          fi
    #
    #          if ! sqlite3 "$DB" "PRAGMA integrity_check;" | grep -q "^ok$"; then
    #            echo "HA DB integrity check FAILED — refusing to start"
    #            exit 1
    #          fi
    #
    #          echo "HA DB integrity check OK"
    #          '

    initContainers:
      config-initialization:
        image:
          repository: docker.io/alpine/git
          tag: 2.54.0@sha256:832b1cd1a271509f3d5272a1a62d4cb2ab1a53426ebde1f6c2cb7349f907dc6f
        command: ["/bin/sh", "-c"]
        args:
          - |-
            set -e
            # 1. Generate the Kopia ignore rules
            echo "[kopia] Writing .kopiaignore..."
            tee /config/.kopiaignore <<!
            /.code-server/logs
            /.git
            /.venv
            /backups
            !

            # 2. Synchronize configuration state from GitHub if empty
            cd /config
            if [ ! -d .git ] ; then
              echo "[git] Initializing config repository from GitHub..."
              mkdir temp-dir
              git clone https://github.com/mergwyn/home-assistant-config temp-dir
              mv temp-dir/.git .
              rm -rf temp-dir
              git checkout .
            fi

            # 3. Installing required tools inside the init container layer
            echo "[init] Installing required tools..."
            apk add --no-cache sqlite jq yq

            echo "[guardrail] Checking Home Assistant SQLite DB..."
            DB=/config/home-assistant_v2.db
            if [ ! -f "$DB" ]; then
              echo "[guardrail] ERROR: DB missing — refusing to start"
              exit 1
            fi

            echo "[guardrail] Checking schema version..."
            if ! sqlite3 "$DB" "PRAGMA schema_version;" > /dev/null; then
              echo "[guardrail] ERROR: Schema version check failed — refusing to start"
              exit 1
            fi

            echo "[guardrail] Running WAL checkpoint..."
            if ! sqlite3 "$DB" "PRAGMA wal_checkpoint(TRUNCATE);" > /dev/null; then
              echo "[guardrail] ERROR: WAL checkpoint failed — refusing to start"
              exit 1
            fi

            echo "[guardrail] Checking schema..."
            if ! sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master;" > /dev/null; then
              echo "[guardrail] ERROR: Schema check failed — refusing to start"
              exit 1
            fi
            echo "[guardrail] DB OK — validation complete."

            # 4. Reconcile BottlecapDave Octopus Energy API key
            echo "[octopus] Reconciling API key..."

            CONFIG_ENTRIES=/config/.storage/core.config_entries

            # Read account and API key from secrets.yaml
            ACCOUNT_ID="$(yq -r '.octopus_account' /config/secrets.yaml)"
            API_KEY="$(yq -r '.octopus_api_key' /config/secrets.yaml)"

            # Validate required secrets
            if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" = "null" ]; then
              echo "[octopus] ERROR: octopus_account missing from secrets.yaml"
              exit 1
            fi

            if [ -z "$API_KEY" ] || [ "$API_KEY" = "null" ]; then
              echo "[octopus] ERROR: octopus_api_key missing from secrets.yaml"
              exit 1
            fi

            # Check the Home Assistant config entries file
            if [ ! -f "$CONFIG_ENTRIES" ]; then
              echo "[octopus] ERROR: config_entries file missing"
              exit 1
            fi

            # Require exactly one matching Octopus account
            MATCH_COUNT="$(
              jq --arg account_id "$ACCOUNT_ID" '
                [
                  .data.entries[]
                  | select(
                      .domain == "octopus_energy"
                      and .data.account_id == $account_id
                      and .data.kind == "account"
                    )
                ] | length
              ' "$CONFIG_ENTRIES"
            )"
            if [ "$MATCH_COUNT" != "1" ]; then
              echo "[octopus] ERROR: Expected one matching account, found $MATCH_COUNT"
              exit 1
            fi

            # Skip the write if the API key is already correct
            if jq -e \
              --arg account_id "$ACCOUNT_ID" \
              --arg api_key "$API_KEY" '
                any(
                  .data.entries[];
                  .domain == "octopus_energy"
                  and .data.account_id == $account_id
                  and .data.kind == "account"
                  and .data.api_key == $api_key
                )
              ' "$CONFIG_ENTRIES" >/dev/null; then
              echo "[octopus] API key already up to date"
            else
              # Write to a temporary file, preserving permissions
              TEMP_FILE="$(mktemp /config/.storage/core.config_entries.XXXXXX)"
              trap 'rm -f "$TEMP_FILE"' EXIT

              jq \
                --arg account_id "$ACCOUNT_ID" \
                --arg api_key "$API_KEY" '
                  .data.entries |= map(
                    if .domain == "octopus_energy"
                       and .data.account_id == $account_id
                       and .data.kind == "account"
                    then .data.api_key = $api_key
                    else .
                    end
                  )
                ' "$CONFIG_ENTRIES" > "$TEMP_FILE"

              FILE_MODE="$(stat -c '%a' "$CONFIG_ENTRIES")"
              chmod "$FILE_MODE" "$TEMP_FILE"
              mv "$TEMP_FILE" "$CONFIG_ENTRIES"
              trap - EXIT

              echo "[octopus] API key updated"
            fi

            echo "[octopus] Keys and account updated from secret"

        securityContext:
          runAsUser: 0

    containers:
      app:
        image:
          repository: ghcr.io/home-assistant/home-assistant
          # yamllint disable-line rule:line-length
          tag: 2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
        env:
          TZ: Europe/London
          VENV_FOLDER: /venv
        envFrom:
          - secretRef:
              name: "{{.Release.Name}}-github"
        resources:
          requests:
            cpu: 163m
            memory: 1239M
          limits:
            memory: 2G

      sqlite-tools:
        image:
          repository: docker.io/library/alpine
          tag: 3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        command: ["/bin/sh", "-c"]
        args:
          - apk add --no-cache sqlite && sleep infinity
        securityContext:
          runAsUser: 0

      code-server:
        image:
          repository: ghcr.io/coder/code-server
          # yamllint disable-line rule:line-length
          tag: 4.137.0@sha256:57ac684d44deb6fa94317b3e8f3e128dd7fb897fffd95b4efcd16f56ce607971
        args:
          - --auth=none
          - --disable-telemetry
          - --disable-update-check
          - --user-data-dir=/config/.code-server
          - --extensions-dir=/config/.code-server
          # - --install-extension=trunk.io
          - --port=12322
          - /config
        env:
          TZ: Europe/London
          HASS_SERVER: http://localhost:8123
          # yamllint disable-line rule:line-length
          EXTENSIONS_GALLERY: '{ "serviceUrl": "https://marketplace.visualstudio.com/_apis/public/gallery", "itemUrl": "https://marketplace.visualstudio.com/items" }'
        envFrom:
          - secretRef:
              name: "{{.Release.Name}}-github"
        resources:
          requests:
            cpu: 10m
            memory: 978M
          limits:
            memory: 5G

service:
  app:
    forceRename: "{{.Release.Name}}"
    ports:
      http:
        port: &http-port 8123
  code-server:
    ports:
      http:
        port: &code-server-port 12322

serviceMonitor:
  app:
    enabled: true
    serviceName: "{{.Release.Name}}"
    endpoints:
      - port: http
        scheme: http
        interval: 1m
        scrapeTimeout: 30s
        path: /api/prometheus
        bearerTokenSecret:
          name: home-assistant-prometheus
          key: token

persistence:
  config:
    forceRename: "{{.Release.Name}}-config"
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    retain: true
    size: 10Gi
    globalMounts:
      - path: /config
  backups:
    enabled: true
    existingClaim: home-assistant-backup-nfs-pvc
    globalMounts:
      - path: /config/backups
  secrets:
    type: secret
    name: "{{.Release.Name}}-secret"
    globalMounts:
      - path: /config/secrets.yaml
        subPath: secrets.yaml
        readOnly: true

  tmpfs:
    type: emptyDir
    advancedMounts:
      home-assistant:
        app:
          - path: /tmp
            subPath: hass-tmp
        code-server:
          - path: /tmp
            subPath: code-server-tmp
          - path: /nonexistent
            subPath: nonexistent

rawResources:
  rules:
    enabled: true
    manifest:
      kind: PrometheusRule
      apiVersion: monitoring.coreos.com/v1
      spec:
        groups:
          - name: home-assistant
            rules:
              - alert: HomeAssistantAbsent
                annotations:
                  description: |
                    Home Assistant has disappeared from
                    Prometheus service discovery.
                  summary: Home Assistant is down.
                expr: |
                  absent(up{job=~".*home-assistant.*"} == 1)
                for: 5m
                labels:
                  severity: critical
              - alert: HomeAssistantGuardrailTriggered
                expr: |
                  kube_pod_container_status_waiting_reason{
                    namespace="home-assistant",
                    pod=~"home-assistant-.*",
                    container="app",
                    reason="CrashLoopBackOff"
                  } > 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: Home Assistant refused to start (DB guardrail)
                  description: |
                    Home Assistant is CrashLooping.
                    This usually indicates a failed SQLite integrity check
                    after restore or storage corruption.
