---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.2.1/charts/library/common/values.schema.json
rawResources:
  secret:
    enabled: true
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      spec:
        secretStoreRef: &store
          kind: ClusterSecretStore
          name: bitwarden-secrets
        target:
          name: "{{.Release.Name}}-secret"
          creationPolicy: Owner
          template:
            data:
              secrets.yaml: |
              # TODD needs:
              # ollama_api_key:
              # openrouter_api_key:
                ha_key: "{{`{{ .ha_api_token }}`}}"
                ollama_api_key: "ollama"
                openrouter_api_key: "{{`{{ (.openrouter | fromYaml).predbat }}`}}"
        data:
          - extract:
            remoteRef:
              key: mqtt_credentials
          - secretKey: predbat
            remoteRef:
              key: openrouter_api_key
          - secretKey: predbat
            remoteRef:
              key: openrouter_api_key
