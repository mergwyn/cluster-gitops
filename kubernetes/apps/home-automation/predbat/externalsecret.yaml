---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.2.1/charts/library/common/values.schema.json
rawResources:
  secret:
    enabled: true
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      spec:
        secretStoreRef: &store
          kind: ClusterSecretStore
          name: bitwarden-secrets
        target:
          name: "{{.Release.Name}}-secret"
          creationPolicy: Owner
          template:
            data:
              secrets.yaml: |
              # TODD needs:
              # ha_key
              # ollama_api_key:
              # openrouter_api_key:
                mqtt_user: "{{`{{ .MQTT_USER }}`}}"
                mqtt_password: "{{`{{ .MQTT_PASSWORD }}`}}"
                wifi_ssid: "{{`{{ .wifi_ssid }}`}}"
                wifi_password: "{{`{{ .wifi_password }}`}}"

        dataFrom:
          - extract:
              key: mqtt_credentials
          - extract:
              key: wifi_credentials
