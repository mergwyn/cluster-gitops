---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

repositories:
  - name: media-servarr
    url: https://media-servarr.shw.al/charts
  - name: bjw-s-labs
    url: https://bjw-s-labs.github.io/helm-charts

releases:
  - name: cleanuparr
    chart: media-servarr/cleanuparr
    version: 0.20.2 # Bumped up to support the 'secrets' configuration block
    inherit:
    - template: namespace
    values:
      - values.yaml.gotmpl

  - name: cleanuparr-ingress
    chart: bjw-s-labs/app-template
    version: 5.2.1
    inherit:
    - template: namespace
    values:
      - values-ingress.yaml.gotmpl
