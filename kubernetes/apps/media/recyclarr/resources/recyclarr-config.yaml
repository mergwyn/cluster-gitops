apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
data:
  recyclarr.yml: |-
    # -------------------------------------------------------------
    # SONARR CONFIGURATION
    # -------------------------------------------------------------
    sonarr:
      sonarr:
        base_url: http://sonarr.vpn.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: series

        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p

        custom_formats:
          # Block non-fallback DV
          - trash_ids:
              - 9b27ab6498ec0f31a3353992e19434ca  # DV (w/o HDR fallback)
            assign_scores_to:
              - name: WEB-1080p
                score: -1000

          # Reject non-English releases (local custom format)
          - trash_ids:
              - local-sonarr-not-english
            assign_scores_to:
              - name: WEB-1080p
                score: -10000

        media_naming:
          series: default
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default

    # -------------------------------------------------------------
    # RADARR CONFIGURATION
    # -------------------------------------------------------------
    radarr:
      radarr:
        base_url: http://radarr.vpn.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true

        quality_definition:
          type: movie

        quality_profiles:
          - name: SQP-1 (2160p)

        custom_formats:
          - trash_ids:
              - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
              - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
            assign_scores_to:
              - name: SQP-1 (2160p)
                score: -1000

          # Reject non-English releases (local custom format)
          - trash_ids:
              - local-radarr-not-english
            assign_scores_to:
              - name: SQP-1 (2160p)
                score: -10000

          # General Release Filtering (Trash Defaults)
          - trash_ids:
              - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
              - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
              - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5  # No-RlsGroup
              - 7357cf5161efbf8c4d5d0c30b4815ee2  # Obfuscated
              - 5c44f52a8714fdd79bb4d98e2673be1f  # Retags
              - f537cf427b64c38c8e36298f657e4828  # Scene
            assign_scores_to:
              - name: SQP-1 (2160p)
                score: 0

        media_naming:
          folder: plex-tmdb
          movie:
            rename: true
            standard: plex-tmdb
  settings.yml: |-
    resource_providers:
      - name: local-sonarr-cfs
        type: custom-formats
        path: /config/custom-formats/sonarr
        service: sonarr
      - name: local-radarr-cfs
        type: custom-formats
        path: /config/custom-formats/radarr
        service: radarr
  sonarr-not-english.json: |-
    {
      "trash_id": "local-sonarr-not-english",
      "name": "Language: Not English",
      "includeCustomFormatWhenRenaming": false,
      "specifications": [
        {
          "name": "Not English Language",
          "implementation": "LanguageSpecification",
          "negate": true,
          "required": false,
          "fields": { "value": 1 }
        }
      ]
    }
  radarr-not-english.json: |-
    {
      "trash_id": "local-radarr-not-english",
      "name": "Language: Not English",
      "includeCustomFormatWhenRenaming": false,
      "specifications": [
        {
          "name": "Not English Language",
          "implementation": "LanguageSpecification",
          "negate": true,
          "required": false,
          "fields": { "value": 1 }
        }
      ]
    }
