---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.3.0/charts/library/common/values.schema.json

controllers:
  recyclarr:
    enabled: true
    type: cronjob
    cronjob:
      schedule: 0 0 * * *
      backoffLimit: 0
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 1
      ttlSecondsAfterFinished: 86400

    containers:
      app:
        image:
          repository: ghcr.io/recyclarr/recyclarr
          # yamllint disable rule:line-length
          tag: 8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
        env:
          TZ: "Europe/London"
        envFrom:
          - secretRef:
              name: "{{ .Release.Name }}-secret"
        args:
          - sync
          # - --debug
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 128Mi
    pod:
      restartPolicy: Never

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 3001
    runAsGroup: 513
    fsGroup: 513
    fsGroupChangePolicy: OnRootMismatch

persistence:
  config:
    type: emptyDir
    globalMounts:
      - path: /config
  recyclarr-files:
    type: configMap
    name: recyclarr-config
    globalMounts:
      - path: /config/recyclarr.yml
        subPath: recyclarr.yml
      - path: /config/settings.yml
        subPath: settings.yml
      - path: /config/custom-formats/sonarr/local-sonarr-not-english.json
        subPath: sonarr-not-english.json
      - path: /config/custom-formats/radarr/local-radarr-not-english.json
        subPath: radarr-not-english.json
  tmp:
    type: emptyDir
