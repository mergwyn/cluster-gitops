---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
bases:
  - ../../../common/base.yaml

repositories:
  - name: bokysan
    url: https://bokysan.github.io/docker-postfix/

releases:
  - name: mail
    chart: bokysan/mail
    version: 5.1.0
    inherit:
      - template: namespace
    values:
      - values.yaml

  - name: mail-external-secret
    inherit:
      - template: namespace
      - template: raw
