---
# Legacy CMP sidecar - travisghansen/argo-cd-helmfile
# Delete this file (and its two references in values.yaml.gotmpl)
# once every app has migrated to pluginName: helmfile-modern.

legacyPluginContainer:
  name: helmfile-plugin
  image: travisghansen/argo-cd-helmfile:v0.3.13@sha256:1251e329f72cadaf55860b9029d13c887559b5f20287915f21d32d722aaeef2e
  command: [/var/run/argocd/argocd-cmp-server]
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops/age/keys.txt
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
  volumeMounts:
    - mountPath: /sops/age
      name: age-secret-keys
    - mountPath: /var/run/argocd
      name: var-files
    - mountPath: /home/argocd/cmp-server/plugins
      name: plugins
    - mountPath: /tmp
      name: helmfile-cmp-tmp
