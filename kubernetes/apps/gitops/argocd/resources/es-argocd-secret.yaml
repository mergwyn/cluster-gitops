---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  secretStoreRef:
    name: bitwarden-vault-login
    kind: ClusterSecretStore
  target:
    name: argocd-secret-new
    creationPolicy: Merge
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Replace=false
      data:
        admin.password: '{{ .password | bcrypt }}'
        admin.passwordMtime: '2026-01-01T00:00:00Z'
  data:
    - secretKey: password
      remoteRef:
        key: d72d94f4-56c3-4577-ae57-b4f00126a169
        property: password
