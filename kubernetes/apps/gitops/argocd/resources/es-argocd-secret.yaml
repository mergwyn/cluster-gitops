---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  secretStoreRef:
    name: bitwarden-vault-login
    kind: ClusterSecretStore
  target:
    name: argocd-secret-new
    creationPolicy: Merge
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Replace=false
      data:
        admin.password: '{{ .raw_password | bcrypt }}'
        admin.passwordMtime: '2026-01-01T00:00:00Z'
  data:
    - secretKey: raw_password
      remoteRef:
        key: 4b06edc5-31a4-45b8-91db-b4ed00e9caee
        property: password
