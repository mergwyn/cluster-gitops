---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  secretStoreRef:
    name: bitwarden-vault-login
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Replace=false
      data:
        admin.password: '{{ .password | bcrypt }}'
        server.secretkey: '{{ .server_secretkey }}'
  data:
    - secretKey: password
      remoteRef:
        key: d72d94f4-56c3-4577-ae57-b4f00126a169
        property: password
    - secretKey: server_secretkey
      remoteRef:
        key: argocd_secret
        property: server.secretkey
      sourceRef:
        storeRef:
          name: bitwarden-secrets
          kind: ClusterSecretStore
