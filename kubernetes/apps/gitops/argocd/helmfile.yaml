---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

repositories:
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: argoproj
    url: https://argoproj.github.io/argo-helm/

releases:
  - name: argocd-secret
    chart: bedag/raw
    version: 2.0.2
    inherit:
      - template: namespace
    secrets:
      - argocd-secret-sops.yaml

  - name: argocd
    chart: argoproj/argo-cd
    version: 10.9.6
    inherit:
      - template: namespace
    values:
      - values-rules.yaml
      - values-base.yaml
      - values.gotmpl

  - name: argocd-externalsecret
    chart: bedag/raw
    version: 2.0.2
    inherit:
      - template: namespace
    values:
      - externalsecret.yaml
