---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../../../common/base.yaml

repositories:
  - name: argoproj
    url: https://argoproj.github.io/argo-helm/

releases:
  - name: argocd
    chart: argoproj/argo-cd
    version: 10.9.6
    inherit:
      - template: namespace
    secrets:
      - argocd-secret-sops.yaml
    values:
      - values-rules.yaml
      - values.yaml
      - values-repo-server.yaml

  - name: argocd-resources
    inherit:
      - template: namespace
      - template: raw
