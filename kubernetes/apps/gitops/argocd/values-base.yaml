---
# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-helm/main/charts/argo-cd/values.yaml

env:
  TZ: Europe/London

configs:
  params:
    # -- Run server without TLS
    server.insecure: true
    # -- Enables use of the Progressive Syncs capability
    # -- no longer set to sync by default
    applicationsetcontroller.enable.progressive.syncs: true

  secret:
    createSecret: false # Created using sops

  cm:
    create: true
    kustomize.buildOptions: --enable-helm
    application.resourceTrackingMethod: "annotation"
    controller.diff.server.side: "true"
    # Exclude velero backups and restores
    resource.exclusions: |
      - apiGroups:
          - "velero.io"
        kinds:
          - Backup
          - Restore
        clusters:
          - "*"
  rbac:
    policy.default: role:admin

repoServer:
  dnsConfig:
    options:
      - name: ndots
        value: "1"
      - name: single-request-reopen
  resources:
    requests:
      cpu: 20m
      memory: 308Mi
    limits:
      memory: 1400M

server:
  # TODO test again when https://github.com/argoproj/argo-helm/issues/3550 resolved
  # httproute:
  #   enabled: true
  #   hostnames:
  #     - "{{.Release.Name}}.{{.Values.global.domain}}"
  #   parentRefs:
  #     - name: traefik-internal
  #       namespace: network
  # grpcroute:
  #   enabled: true
  #   hostnames:
  #     - "{{.Release.Name}}.{{.Values.global.domain}}"
  #   parentRefs:
  #     - name: traefik-internal
  #       namespace: network
  #   rules:
  #     - matches:
  #         - headers:
  #             - name: Content-Type
  #               type: RegularExpression
  #               value: "^application/grpc.*$"

  resources:
    requests:
      cpu: 15m
      memory: 236Mi
    limits:
      # cpu: 50m
      memory: 1416M

controller:
  resources:
    requests:
      cpu: 350m
      memory: 1844Mi
    limits:
      memory: 2048Mi

applicationSet:
  resources:
    requests:
      cpu: 15m
      memory: 105M
    limits:
      # cpu: 34m
      memory: 1183M

dex:
  resources:
    requests:
      cpu: 15m
      memory: 105M
    limits:
      # cpu: 16m
      memory: 750M

notifications:
  resources:
    requests:
      cpu: 15m
      memory: 105M
    limits:
      # cpu: 16m
      memory: 750M

redis:
  resources:
    requests:
      cpu: 22m
      memory: 105M
    limits:
      # cpu: 52m
      memory: 174M

# Volumes shared by both plugin sidecars.
# NOTE: "plugins" and "var-files" are chart-provided built-in volumes
# for CMP sidecars - do not declare them here, they exist automatically.
sharedVolumes:
  - name: age-secret-keys
    secret:
      secretName: argocd-age-secret-keys
  - name: helmfile-cmp-tmp
    emptyDir: {}

baseExtraObjects:
  - kind: IngressRoute
    apiVersion: traefik.io/v1alpha1
    metadata:
      name: argocd-server
      namespace: argocd
    spec:
      ingressClassName: traefik-external
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`argocd.theclarkhome.com`)
          priority: 10
          services:
            - name: argocd-server
              port: 80
        - kind: Rule
          # yamllint disable-line rule:line-length
          match: Host(`argocd.theclarkhome.com`) && Header(`Content-Type`, `application/grpc`)
          priority: 11
          services:
            - name: argocd-server
              port: 80
              scheme: h2c
      tls: {}
