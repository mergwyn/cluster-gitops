---
resources:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: &admin argocd-initial-admin-secret
      namespace: argocd
      labels:
        app.kubernetes.io/name: argocd
    spec:
      secretStoreRef:
        kind: ClusterSecretStore
        name: bitwarden-secrets
      target:
        name: *admin
        creationPolicy: Owner
      dataFrom:
        - extract:
            key: argocd_admin_password
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: &vault argocd-initial-admin-secret-vault
    spec:
      target:
        name: *vault
      data:
        - secretKey: password
          sourceRef:
            storeRef:
              name: bitwarden-vault-login
              kind: ClusterSecretStore
          remoteRef:
            key: 96d4f799-6ecc-46e3-99dc-b1d30088ce04
            property: password
