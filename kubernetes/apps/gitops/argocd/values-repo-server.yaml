---
# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-helm/main/charts/argo-cd/values.yaml

# Repo-server with the helmfile-modern CMP sidecar.
# The ConfigMaps mounted here are created by the argocd-resources release
# (resources/cmp-config.yaml and resources/cmp-script.yaml).

repoServer:
  podAnnotations:
    configmap.reloader.stakater.com/reload: "helmfile-modern-config,helmfile-modern-generate-script"
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  resources:
    requests:
      cpu: 20m
      memory: 308Mi
    limits:
      memory: 1400M

  # "plugins" and "var-files" are chart-provided volumes for CMP sidecars.
  # Do not declare them here.
  volumes:
    - name: age-secret-keys
      secret:
        secretName: argocd-age-secret-keys
    - name: helmfile-cmp-tmp
      emptyDir: {}
    - name: custom-tools # populated by the download-tools init container
      emptyDir: {}
    - name: helmfile-modern-config
      configMap:
        name: helmfile-modern-config
    - name: helmfile-modern-script
      configMap:
        name: helmfile-modern-generate-script
        defaultMode: 0755

  initContainers:
    - name: download-tools
      image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      command: ["sh", "-c"]
      args:
        - |
          set -e
          set -x

          nslookup google.com

          apk update && apk add --no-cache ca-certificates tar

          # renovate: datasource=github-releases depName=helmfile/helmfile
          CUSTOM_HELMFILE_VERSION="v1.8.2"
          # renovate: datasource=github-releases depName=getsops/sops
          CUSTOM_SOPS_VERSION="v3.13.3"
          # renovate: datasource=github-releases depName=helm/helm
          CUSTOM_HELM_VERSION="v4.3.1"
          # renovate: datasource=github-tags depName=jkroepke/helm-secrets
          SECRETS_VERSION="4.7.9"
          # renovate: datasource=github-releases depName=databus23/helm-diff
          DIFF_VERSION="v3.15.15"

          # 1. Download core binaries
          wget -qO- "https://get.helm.sh/helm-${CUSTOM_HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          mv /tmp/linux-amd64/helm /custom-tools/helm

          wget -qO- "https://github.com/helmfile/helmfile/releases/download/${CUSTOM_HELMFILE_VERSION}/helmfile_${CUSTOM_HELMFILE_VERSION#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
          mv /tmp/helmfile /custom-tools/helmfile
          chmod +x /custom-tools/helmfile

          wget -qO /custom-tools/sops "https://github.com/getsops/sops/releases/download/${CUSTOM_SOPS_VERSION}/sops-${CUSTOM_SOPS_VERSION}.linux.amd64"
          chmod +x /custom-tools/sops

          # 2. Pre-install Helm OCI plugins
          export HELM_PLUGINS="/custom-tools/helm-plugins"
          /custom-tools/helm plugin install oci://ghcr.io/jkroepke/helm-secrets/secrets:${SECRETS_VERSION} --verify=false
          /custom-tools/helm plugin install oci://ghcr.io/jkroepke/helm-secrets/secrets-getter:${SECRETS_VERSION} --verify=false
          /custom-tools/helm plugin install oci://ghcr.io/jkroepke/helm-secrets/secrets-post-renderer:${SECRETS_VERSION} --verify=false

          # 3. Extract helm-diff
          mkdir -p /custom-tools/helm-plugins/helm-diff
          wget -qO- "https://github.com/databus23/helm-diff/releases/download/${DIFF_VERSION}/helm-diff-linux-amd64.tgz" | tar -xz -C /custom-tools/helm-plugins/helm-diff

          echo "All binaries and plugins successfully compiled!"
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

  extraContainers:
    - name: helmfile-modern-plugin
      # Standard ArgoCD image, used only to run cmp-server
      image: quay.io/argoproj/argocd:v2.10.4@sha256:a2ce24e264c5be63ce4af478f086a866f6df2b68673ad5e5c8f4574de1d00eae
      command: [/var/run/argocd/argocd-cmp-server]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        # cmp-server runtime
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins # socket dir
          name: plugins
        - mountPath: /tmp
          name: helmfile-cmp-tmp

        # Secrets
        - mountPath: /sops/age
          name: age-secret-keys

        # Tools from the download-tools init container
        - mountPath: /usr/local/bin/helmfile
          name: custom-tools
          subPath: helmfile
        - mountPath: /usr/local/bin/sops
          name: custom-tools
          subPath: sops
        - mountPath: /usr/local/bin/helm
          name: custom-tools
          subPath: helm
        - mountPath: /home/argocd/.local/share/helm/plugins
          name: custom-tools
          subPath: helm-plugins

        # Plugin definition and generate script (ConfigMaps)
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          name: helmfile-modern-config
          subPath: plugin.yaml
        - mountPath: /usr/local/bin/helmfile-modern-generate.sh
          name: helmfile-modern-script
          subPath: helmfile-modern-generate.sh
