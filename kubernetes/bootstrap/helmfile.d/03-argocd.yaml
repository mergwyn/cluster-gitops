---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../bootstrap-bases.yaml

repositories:
  - name: argoproj
    url: https://argoproj.github.io/argo-helm/

releases:
  - name: argocd
    chart: argoproj/argo-cd
    version: 10.9.6
    namespace: argocd
    secrets:
      - ../../apps/gitops/argocd/argocd-secret-sops.yaml
    values:
      # - values-rules.yaml  # rules will ne installed by argocd run
      - ../../apps/gitops/argocd/values.yaml
      - ../../apps/gitops/argocd/values-repo-server.yaml

  - name: argocd-resources
    namespace: argocd
    inherit:
      - template: raw
    chart: ../../apps/gitops/argocd/resources
