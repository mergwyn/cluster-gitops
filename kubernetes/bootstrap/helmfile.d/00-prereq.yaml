---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

bases:
  - ../bootstrap-bases.yaml

repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts/
  - name: traefik
    url: https://traefik.github.io/charts


releases:

  # Install gateway crds so ArgoCD can manage Gateway API resources.
  - name: gateway-api-crds
    namespace: kube-system
    chart: ../../apps/network/gateway-api-crds/crds

  # Bootstrap-only: install CRDs so ArgoCD can manage prometheysRule resources.
    # Runtime is installed later by ArgoCD using the same chart.
  - name: kube-prometheus-stack
    chart: prometheus-community/kube-prometheus-stack
    namespace: monitoring
    version: 90.2.0
    set:
      - name: crds.enabled
        value: "true"
      - name: prometheusOperator.enabled
        value: "false"
      - name: prometheus.enabled
        value: "false"
      - name: alertmanager.enabled
        value: "false"
      - name: grafana.enabled
        value: "false"
      - name: kubeStateMetrics.enabled
        value: "false"
      - name: nodeExporter.enabled
        value: "false"
      - name: coreDns.enabled
        value: "false"
      - name: kubeControllerManager.enabled
        value: "false"
      - name: kubeEtcd.enabled
        value: "false"
      - name: kubeProxy.enabled
        value: "false"
      - name: kubeScheduler.enabled
        value: "false"
      - name: kubelet.enabled
        value: "false"
      - name: kubeApiServer.enabled
        value: "false"

  # Bootstrap-only: install CRDs so ArgoCD can manage IngressRoute resources.
  # Runtime is installed later by ArgoCD using the same chart.
  - name: traefik
    namespace: network
    chart: traefik/traefik
    version: 41.7.1
    set:
      - name: providers.kubernetesCRD.enabled
        value: "true"
      - name: providers.kubernetesIngress.enabled
        value: "false"
      - name: service.enabled
        value: "false"
      - name: deployment.enabled
        value: "false"
      - name: ingressClass.enabled
        value: "false"
      - name: rbac.enabled
        value: "false"
      - name: serviceAccount.name
        value: undef
