---
name: Validate Renovate Config

on:
  pull_request:
    paths:
      - 'renovate/**'
      - '.renovate/**'
  push:
    branches:
      - main
    paths:
      - 'renovate/**'
      - '.renovate/**'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:latest@sha256:11431b10c52c306bb280171f80d409e1fb482e5a61a845cfef93f34b4d649d5d
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: renovate-config-validator --strict
