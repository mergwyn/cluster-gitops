---
name: Validate Renovate Config

on:
  pull_request:
    paths:
      - 'renovate/**'
      - '.renovate/**'
  push:
    branches:
      - main
    paths:
      - 'renovate/**'
      - '.renovate/**'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:latest@sha256:9f04f781580e6de8dee7f3cca6b00cf24cbe6006dbb18742d786fb77838724bb
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: renovate-config-validator --strict
