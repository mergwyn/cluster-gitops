name: esphome-check
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dummy secrets
        run: bash scripts/make-dummy-secrets.sh
      - name: Validate configs
        run: |
          docker run --rm -v "$PWD":/config -w /config \
            ghcr.io/esphome/esphome:2025.10.0 \
            config samsung-hvac-bus.yaml samsung-nasa.yaml